<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- electric cyan-azure backdrop (distinct from Wi-Fi's royal blue) with a bloom behind the title -->
    <radialGradient id="bg" cx="0.30" cy="0.04" r="1.15">
      <stop offset="0"    stop-color="#0fb4e6"/>
      <stop offset="0.36" stop-color="#05709e"/>
      <stop offset="0.74" stop-color="#03384f"/>
      <stop offset="1"    stop-color="#011820"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8ff3ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#c9fbff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#6fe2ff" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#8ff3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="numFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c2f6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.5 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .t    { font-family: system-ui, Helvetica, Arial, sans-serif; }
      .h1   { font-size: 50px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .h1l  { font-size: 50px; font-weight: 300; fill: #c9f4ff; letter-spacing: -0.5px; }
      .h2   { font-size: 21px; font-weight: 400; fill: #b2e6f5; }
      .big  { font-size: 58px; font-weight: 800; fill: url(#numFill); letter-spacing: -1px; }
      .unit { font-size: 30px; font-weight: 700; fill: #c2f6ff; }
      .lbl  { font-size: 19px; font-weight: 600; fill: #effcff; }
      .sub  { font-size: 14px; font-weight: 400; fill: #a3dbea; }
      .badge{ font-size: 17px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
      .chip { font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- light ribbons: long waves that rise where the Wi-Fi ones dip, two of them crossing -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M -40 520 C 240 600, 470 400, 760 490 S 1080 590, 1260 500" stroke-width="2.4" opacity="0.55" filter="url(#soft)"/>
    <path d="M -40 470 C 280 400, 500 580, 800 480 S 1110 400, 1260 455" stroke-width="1.4" opacity="0.45"/>
    <path d="M -40 555 C 300 620, 520 470, 820 545 S 1120 610, 1260 540" stroke-width="3.2" opacity="0.25" filter="url(#soft)"/>
    <path d="M -40 435 C 320 500, 560 360, 860 440 S 1140 500, 1260 430" stroke-width="1" opacity="0.35"/>
    <path d="M -40 85 C 300 140, 560 40, 860 100 S 1120 140, 1260 80" stroke-width="1" opacity="0.18"/>
  </g>

  <!-- bokeh -->
  <g fill="#b8f6ff" filter="url(#bokeh)">
    <circle cx="1080" cy="150" r="7" opacity="0.30"/>
    <circle cx="1010" cy="128" r="4" opacity="0.35"/>
    <circle cx="880"  cy="40"  r="5" opacity="0.25"/>
    <circle cx="160"  cy="600" r="6" opacity="0.28"/>
    <circle cx="420"  cy="610" r="4" opacity="0.30"/>
    <circle cx="690"  cy="598" r="8" opacity="0.18"/>
    <circle cx="1140" cy="602" r="5" opacity="0.30"/>
    <circle cx="560"  cy="30"  r="3" opacity="0.30"/>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- title, subtitle, firmware badge -->
  <text class="t" x="60" y="92"><tspan class="h1">Bluetooth Turbo</tspan><tspan class="h1l"> for PS Vita</tspan></text>
  <text class="t h2" x="60" y="128">A taiHEN plugin for the Vita's Bluetooth sound: works with modern earbuds, lags less, sounds your way.</text>
  <rect x="918" y="58" width="222" height="42" rx="21" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.45"/>
  <text class="t badge" x="1029" y="85" text-anchor="middle">FIRMWARE 3.60–3.74</text>

  <!-- tiles: 4 x 2 -->
  <g>
    <rect x="60" y="164" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="335" y="164" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="610" y="164" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="885" y="164" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="60" y="388" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="335" y="388" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="610" y="388" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <rect x="885" y="388" width="255" height="200" rx="20" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
    <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1">
      <line x1="84" y1="165" x2="291" y2="165"/>
      <line x1="359" y1="165" x2="566" y2="165"/>
      <line x1="634" y1="165" x2="841" y2="165"/>
      <line x1="909" y1="165" x2="1116" y2="165"/>
      <line x1="84" y1="389" x2="291" y2="389"/>
      <line x1="359" y1="389" x2="566" y2="389"/>
      <line x1="634" y1="389" x2="841" y2="389"/>
      <line x1="909" y1="389" x2="1116" y2="389"/>
    </g>
  </g>

  <g filter="url(#glow)">
    <text class="t" x="82" y="244"><tspan class="big">Fixed</tspan></text>
    <text class="t" x="357" y="244"><tspan class="big">Battery</tspan></text>
    <text class="t" x="632" y="244"><tspan class="big">5</tspan><tspan class="unit"> bands</tspan></text>
    <text class="t" x="82" y="468"><tspan class="big">−69</tspan><tspan class="unit"> %</tspan></text>
    <text class="t" x="357" y="468"><tspan class="big">−100</tspan><tspan class="unit"> %</tspan></text>
    <text class="t" x="907" y="468"><tspan class="big">+88</tspan><tspan class="unit"> %</tspan></text>
    <text class="t" x="907" y="244"><tspan class="big">+3</tspan><tspan class="unit"> codecs</tspan></text>
    <text class="t" x="632" y="468"><tspan class="big">−100</tspan><tspan class="unit"> %</tspan></text>
  </g>

  <text class="t lbl" x="82" y="282">for modern Bluetooth</text>
  <text class="t lbl" x="82" y="305">earbuds</text>
  <text class="t sub" x="82" y="330">packet timestamp corrected</text>
  <text class="t sub" x="82" y="348">(8000 → 512)</text>
  <text class="t lbl" x="357" y="282">Read from the</text>
  <text class="t lbl" x="357" y="305">headset</text>
  <text class="t sub" x="357" y="330">system notification at</text>
  <text class="t sub" x="357" y="348">20%, 10% and 5%</text>
  <text class="t lbl" x="632" y="282">equaliser for</text>
  <text class="t lbl" x="632" y="305">headphones</text>
  <text class="t sub" x="632" y="330">presets or your own,</text>
  <text class="t sub" x="632" y="348">±12 dB</text>
  <text class="t lbl" x="82" y="506">less sound left in</text>
  <text class="t lbl" x="82" y="529">the queue</text>
  <text class="t sub" x="82" y="554">~245 ms → ~75 ms</text>
  <text class="t sub" x="82" y="572">at Lowest</text>
  <text class="t lbl" x="357" y="506">controller polling</text>
  <text class="t lbl" x="357" y="529">delay</text>
  <text class="t sub" x="357" y="554">up to 11.25 ms → none</text>
  <text class="t sub" x="357" y="572">(DS3/DS4)</text>
  <!-- codecs tile: names as plain typographic chips, no logos -->
  <g>
    <rect x="907" y="260" width="54" height="28" rx="14" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.6"/>
    <text class="t chip" x="934" y="280" text-anchor="middle">AAC</text>
    <rect x="969" y="260" width="66" height="28" rx="14" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.6"/>
    <text class="t chip" x="1002" y="280" text-anchor="middle">aptX™</text>
    <rect x="1043" y="260" width="74" height="28" rx="14" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.6"/>
    <text class="t chip" x="1080" y="280" text-anchor="middle">LDAC™</text>
  </g>
  <text class="t lbl" x="907" y="311">alongside SBC</text>
  <text class="t sub" x="907" y="332">better sound or less delay,</text>
  <text class="t sub" x="907" y="350">auto-detected add-ons</text>
  <text class="t lbl" x="907" y="506">more bit rate with</text>
  <text class="t lbl" x="907" y="529">Highest</text>
  <text class="t sub" x="907" y="554">~357 → ~670 kb/s</text>
  <text class="t sub" x="907" y="572">each ear separately</text>
  <text class="t lbl" x="632" y="506">fewer drop-outs with</text>
  <text class="t lbl" x="632" y="529">the new Stable profile</text>
  <text class="t sub" x="632" y="554">up to ~4300 a minute → 0,</text>
  <text class="t sub" x="632" y="572">edge of range, Wi-Fi busy</text>
  <text class="t" x="600" y="614" text-anchor="middle" style="font-size:16px;fill:#c2f6ff"><tspan style="font-weight:700;fill:#effcff">Pairs nicely with Wi-Fi Turbo:</tspan> with both enabled, Bluetooth stays clear of the full 40 MHz Wi-Fi channel, so the two never clash.</text>
</svg>
