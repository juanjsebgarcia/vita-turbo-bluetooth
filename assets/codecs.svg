<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- electric cyan-azure backdrop (distinct from Wi-Fi's royal blue) with a bloom behind the title -->
    <radialGradient id="bg" cx="0.30" cy="0.04" r="1.15">
      <stop offset="0"    stop-color="#0fb4e6"/>
      <stop offset="0.36" stop-color="#05709e"/>
      <stop offset="0.74" stop-color="#03384f"/>
      <stop offset="1"    stop-color="#011820"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1"   stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8ff3ff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#c9fbff" stop-opacity="0.9"/>
      <stop offset="0.8" stop-color="#6fe2ff" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#8ff3ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tileStroke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="tileFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="numFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c2f6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.35  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.5 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="bokeh" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      .t    { font-family: system-ui, Helvetica, Arial, sans-serif; }
      .h1   { font-size: 50px; font-weight: 800; fill: #ffffff; letter-spacing: -0.5px; }
      .h1l  { font-size: 50px; font-weight: 300; fill: #c9f4ff; letter-spacing: -0.5px; }
      .h2   { font-size: 21px; font-weight: 400; fill: #b2e6f5; }
      .big  { font-size: 58px; font-weight: 800; fill: url(#numFill); letter-spacing: -1px; }
      .unit { font-size: 30px; font-weight: 700; fill: #c2f6ff; }
      .lbl  { font-size: 19px; font-weight: 600; fill: #effcff; }
      .sub  { font-size: 14px; font-weight: 400; fill: #a3dbea; }
      .badge{ font-size: 17px; font-weight: 700; fill: #ffffff; letter-spacing: 0.4px; }
      .chip { font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: 0.3px; }
      .cname{ font-size: 40px; font-weight: 800; fill: url(#numFill); letter-spacing: -0.5px; }
      .what { font-size: 24px; font-weight: 700; fill: #effcff; }
      .pt   { font-size: 26px; font-weight: 800; fill: url(#numFill); letter-spacing: -0.3px; }
      .k    { font-size: 15px; font-weight: 800; fill: #8fe9ff; letter-spacing: 1.6px; }
      .hl   { font-size: 22px; font-weight: 800; fill: #ffffff; }
      .hs   { font-size: 16px; font-weight: 400; fill: #a3dbea; }
      .scr  { font-size: 14px; font-weight: 400; fill: #cfefff; }
      .scrb { font-size: 14px; font-weight: 700; fill: #ffffff; }
    </style>
  <style>
  .pl  { font-size: 14px; font-weight: 700; fill: #effcff; }
  .ple { font-size: 14px; font-weight: 700; fill: #c9fbff; }
  .lab { font-size: 13px; font-weight: 800; fill: #8fe9ff; letter-spacing: 1.2px; }
  .lv  { font-size: 14px; font-weight: 400; fill: #b2e6f5; }
  .lvb { font-size: 14px; font-weight: 700; fill: #effcff; }
  .note{ font-size: 13px; font-weight: 400; fill: #8fd3e6; }
</style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- light ribbons: long waves that rise where the Wi-Fi ones dip, two of them crossing -->
  <g fill="none" stroke="url(#arc)" stroke-linecap="round">
    <path d="M -40 520 C 240 600, 470 400, 760 490 S 1080 590, 1260 500" stroke-width="2.4" opacity="0.55" filter="url(#soft)"/>
    <path d="M -40 470 C 280 400, 500 580, 800 480 S 1110 400, 1260 455" stroke-width="1.4" opacity="0.45"/>
    <path d="M -40 555 C 300 620, 520 470, 820 545 S 1120 610, 1260 540" stroke-width="3.2" opacity="0.25" filter="url(#soft)"/>
    <path d="M -40 435 C 320 500, 560 360, 860 440 S 1140 500, 1260 430" stroke-width="1" opacity="0.35"/>
    <path d="M -40 85 C 300 140, 560 40, 860 100 S 1120 140, 1260 80" stroke-width="1" opacity="0.18"/>
  </g>

  <!-- bokeh -->
  <g fill="#b8f6ff" filter="url(#bokeh)">
    <circle cx="1080" cy="150" r="7" opacity="0.30"/>
    <circle cx="1010" cy="128" r="4" opacity="0.35"/>
    <circle cx="880"  cy="40"  r="5" opacity="0.25"/>
    <circle cx="160"  cy="600" r="6" opacity="0.28"/>
    <circle cx="420"  cy="610" r="4" opacity="0.30"/>
    <circle cx="690"  cy="598" r="8" opacity="0.18"/>
    <circle cx="1140" cy="602" r="5" opacity="0.30"/>
    <circle cx="560"  cy="30"  r="3" opacity="0.30"/>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <text class="t" x="60" y="92"><tspan class="h1">Enhanced</tspan><tspan class="h1l"> codec support</tspan></text>
  <text class="t h2" x="60" y="128">The Vita's own Bluetooth sound is SBC only. Bluetooth Turbo adds three more codecs and a better SBC.</text>
<rect x="60" y="148" width="150" height="332" rx="22" fill="#000000" fill-opacity="0.18" stroke="#ffffff" stroke-opacity="0.14"/>
  <text class="t k" x="76" y="186" style="fill:#7fb6c6">WITHOUT IT</text>
  <text class="t" x="76" y="218" style="font-size:17px;font-weight:600;fill:#9cc7d4">the Vita's</text>
  <text class="t" x="76" y="240" style="font-size:17px;font-weight:600;fill:#9cc7d4">Bluetooth sound</text>
  <rect x="76" y="266" width="118" height="58" rx="29.0" fill="#ffffff" fill-opacity="0.06" stroke="#c9fbff" stroke-opacity="0.4"/><text class="t" x="135.0" y="309.5" text-anchor="middle" filter="url(#glow)" style="font-size:48px;font-weight:800;fill:url(#numFill);letter-spacing:-0.5px">SBC</text>
  <text class="t" x="135" y="360" text-anchor="middle" style="font-size:22px;font-weight:700;fill:#9cc7d4">only</text>
  <text class="t sub" x="76" y="400" style="fill:#86b9c8">one codec,</text>
  <text class="t sub" x="76" y="418" style="fill:#86b9c8">~357 kb/s, for</text>
  <text class="t sub" x="76" y="436" style="fill:#86b9c8">every pair of</text>
  <text class="t sub" x="76" y="454" style="fill:#86b9c8">headphones</text>
  <path d="M 219 314 L 235 314 M 225 304 L 236 314 L 225 324" fill="none" stroke="#c9fbff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <rect x="245" y="148" width="895" height="332" rx="22" fill="url(#tileFill)" stroke="url(#tileStroke)" stroke-width="1.2"/>
  <line x1="269" y1="149" x2="1116" y2="149" stroke="#ffffff" stroke-opacity="0.35"/>
  <text class="t k" x="268" y="182">WITH BLUETOOTH TURBO</text>
  <rect x="268" y="198" width="112" height="58" rx="29.0" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.7"/><text class="t" x="324.0" y="241.5" text-anchor="middle" filter="url(#glow)" style="font-size:40px;font-weight:800;fill:url(#numFill);letter-spacing:-0.5px">AAC</text>
  <text class="t what" x="268" y="286" style="font-size:22px">very good quality</text>
  <text class="t sub" x="268" y="310">256 kb/s, up to 320,</text>
  <text class="t sub" x="268" y="328">hardware accelerated;</text>
  <text class="t sub" x="268" y="346">common on phone earbuds</text>
  <text class="t lab" x="268" y="372">BIT RATES, kb/s</text>
  <rect x="268" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="288.5" y="399" text-anchor="middle">128</text>
  <rect x="315" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="335.5" y="399" text-anchor="middle">192</text>
  <rect x="362" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="382.5" y="399" text-anchor="middle">256</text>
  <rect x="409" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="429.5" y="399" text-anchor="middle">320</text>
  <rect x="462" y="198" width="140" height="58" rx="29.0" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.7"/><text class="t" x="532.0" y="241.5" text-anchor="middle" filter="url(#glow)" style="font-size:40px;font-weight:800;fill:url(#numFill);letter-spacing:-0.5px">aptX™</text>
  <text class="t what" x="462" y="286" style="font-size:22px">lowest delay</text>
  <text class="t sub" x="462" y="310">about 1.9 ms codec</text>
  <text class="t sub" x="462" y="328">delay (measured)</text>
  <text class="t lab" x="462" y="372">BIT RATES, kb/s</text>
  <rect x="462" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="482.5" y="399" text-anchor="middle">384</text>
  <rect x="462" y="412" width="104" height="24" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#c9fbff" stroke-opacity="0.75" stroke-dasharray="4 3"/><text class="t ple" x="514.0" y="429" text-anchor="middle">aptX HD 576</text>
  <rect x="656" y="198" width="152" height="58" rx="29.0" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.7"/><text class="t" x="732.0" y="241.5" text-anchor="middle" filter="url(#glow)" style="font-size:40px;font-weight:800;fill:url(#numFill);letter-spacing:-0.5px">LDAC™</text>
  <text class="t what" x="656" y="286" style="font-size:22px">highest quality</text>
  <text class="t sub" x="656" y="310">330 or 660 kb/s,</text>
  <text class="t sub" x="656" y="328">Adaptive experimental</text>
  <text class="t lab" x="656" y="372">BIT RATES, kb/s</text>
  <rect x="656" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="676.5" y="399" text-anchor="middle">330</text>
  <rect x="703" y="382" width="41" height="24" rx="12" fill="#c9fbff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.45"/><text class="t pl" x="723.5" y="399" text-anchor="middle">660</text>
  <rect x="656" y="412" width="88" height="24" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#c9fbff" stroke-opacity="0.75" stroke-dasharray="4 3"/><text class="t ple" x="700.0" y="429" text-anchor="middle">Adaptive</text>
  <rect x="846" y="164" width="278" height="302" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#c9fbff" stroke-opacity="0.30"/>
  <rect x="860" y="198" width="112" height="58" rx="29.0" fill="#ffffff" fill-opacity="0.16" stroke="#c9fbff" stroke-opacity="0.7"/><text class="t" x="916.0" y="241.5" text-anchor="middle" filter="url(#glow)" style="font-size:40px;font-weight:800;fill:url(#numFill);letter-spacing:-0.5px">SBC</text>
  <text class="t lab" x="986" y="223"></text>
  <text class="t lab" x="986" y="241">IMPROVED</text>
  <text class="t what" x="860" y="286" style="font-size:22px">each ear its own stream</text>
  <text class="t sub" x="860" y="310">dual channel, up to ~670 kb/s</text>
  <text class="t lab" x="860" y="338">QUALITY, kb/s</text>
  <text class="t lv" x="860" y="360">Stable</text>
  <text class="t lv" x="932" y="360">~260</text>
  <text class="t lv" x="860" y="381">Balanced</text>
  <text class="t lv" x="932" y="381">~310</text>
  <text class="t lvb" x="860" y="402">Standard</text>
  <text class="t lvb" x="932" y="402">~357</text>
  <text class="t note" x="1000" y="402">the Vita's default</text>
  <text class="t lvb" x="860" y="423">High</text>
  <text class="t lvb" x="932" y="423">~490</text>
  <text class="t lvb" x="860" y="444">Highest</text>
  <text class="t lvb" x="932" y="444">~670–740</text>
  <rect x="925" y="429" width="88" height="21" rx="10.5" fill="none" stroke="#c9fbff" stroke-opacity="0.75" stroke-dasharray="4 3"/>
  <path d="M 1022 410 q 6 0 6 6 v 9.5 l 5 4 l -5 4 v 9.5 q 0 6 -6 6" fill="none" stroke="#c9fbff" stroke-opacity="0.7" stroke-width="1.6"/>
  <text class="t note" x="1038" y="426.5">each ear</text>
  <text class="t note" x="1038" y="442.5">separately</text>
  <text class="t sub" x="268" y="462" style="fill:#c2f6ff">+ SBC stays as the automatic fallback, with a system notification</text>
  <rect x="706" y="447" width="34" height="20" rx="10" fill="none" stroke="#c9fbff" stroke-opacity="0.75" stroke-dasharray="4 3"/>
  <text class="t note" x="748" y="462">experimental</text>
  <path d="M 64 523 l 6 6 l 12 -12" fill="none" stroke="#c9fbff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="t" x="94" y="530"><tspan style="font-size:18px;font-weight:800;fill:#ffffff">Applies at once:</tspan><tspan style="font-size:18px;font-weight:400;fill:#b2e6f5"> headphones reconnect themselves</tspan></text>
  <path d="M 626 523 l 6 6 l 12 -12" fill="none" stroke="#c9fbff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="t" x="656" y="530"><tspan style="font-size:18px;font-weight:800;fill:#ffffff">Headset Codecs Report:</tspan><tspan style="font-size:18px;font-weight:400;fill:#b2e6f5"> what your headphones support</tspan></text>
  <path d="M 64 571 l 6 6 l 12 -12" fill="none" stroke="#c9fbff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="t" x="94" y="578"><tspan style="font-size:18px;font-weight:800;fill:#ffffff">No performance impact on games</tspan><tspan style="font-size:18px;font-weight:400;fill:#b2e6f5"> – uses system core</tspan></text>
  <path d="M 626 571 l 6 6 l 12 -12" fill="none" stroke="#c9fbff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <text class="t" x="656" y="578"><tspan style="font-size:18px;font-weight:800;fill:#ffffff">Adjustable bit rate:</tspan><tspan style="font-size:18px;font-weight:400;fill:#b2e6f5"> per codec, in Codec Settings</tspan></text>
</svg>
